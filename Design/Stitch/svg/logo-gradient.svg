<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <linearGradient id="fr-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6C4CF1" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>
    <linearGradient id="fr-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.6" />
    </linearGradient>
    <filter id="fr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6C4CF1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="12" y="12" width="136" height="136" rx="36" fill="url(#fr-grad)" filter="url(#fr-glow)"/>
  <!-- Flip card background silhouette -->
  <rect x="42" y="38" width="76" height="84" rx="14" fill="#ffffff" fill-opacity="0.18" transform="rotate(-8 80 80)"/>
  <!-- Front card silhouette -->
  <rect x="44" y="38" width="72" height="84" rx="14" fill="#ffffff" fill-opacity="0.95"/>
  <!-- Dynamic Lightning Bolt cutting through -->
  <path d="M84 46L60 84H78L74 114L102 74H84L92 46Z" fill="url(#fr-grad)"/>
  <!-- Sparkle dots -->
  <circle cx="106" cy="50" r="3" fill="#22D3EE"/>
  <circle cx="54" cy="112" r="2.5" fill="#6C4CF1"/>
</svg>